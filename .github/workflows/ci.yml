name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install API dependencies
        # The PDF parser (unstructured) is stubbed in tests, so it is not installed here.
        run: |
          python -m pip install --upgrade pip
          pip install chromadb fastapi google-genai pydantic python-multipart uvicorn httpx pytest ruff
      - name: Lint
        run: ruff check . --select E9,F63,F7,F82
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t multimodal-rag:ci .
